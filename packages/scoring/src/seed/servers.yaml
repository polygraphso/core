# Curated seed list of MCP servers for polygraph scoring.
#
# Sources (78 entries total, verified against npm / pypi at seed time):
#
#   1. @modelcontextprotocol/* reference servers (npm) — canonical set,
#      verified live on registry.npmjs.org.
#   2. mcp-server-* reference servers (pypi) — the Python-implemented
#      counterparts, verified live on pypi.org.
#   3. Well-known third-party MCP packages — Notion, Cloudflare, Supabase,
#      Upstash. Hand-picked, verified live.
#   4. The Official MCP Registry at registry.modelcontextprotocol.io —
#      every listing is vetted by the MCP team. We snapshot the
#      `isLatest`+`active` entries with an npm or pypi `packages[]`
#      entry, deduplicated by (registry, owner, name). This is a
#      static snapshot; a live "registry sync" adapter is a later
#      phase.
#
# Maintenance rules:
#   - **Add** by appending YAML rows; the seed script upserts on
#     (registry, owner, name) with `nulls not distinct` so unscoped
#     npm packages (owner: null) round-trip correctly.
#   - **Remove** by commenting out, not deleting — the row + its history
#     in versions / adoption_scores stays valid; a hard delete would
#     orphan downstream rows.
#   - **Schema** — every entry has `registry` (npm | pypi | github),
#     `name`, and an optional `owner`. pypi/github require owner; only
#     unscoped npm packages may omit it.
#   - **Cross-registry identities** — entries may also carry optional
#     `smithery_qualified_name` and `glama_namespace_slug` fields. When
#     present, the seed script writes corresponding `server_identities`
#     rows so the Smithery / Glama adapters can look up the correct entry.
#     Without these, the adapter is skipped for that server and the signal
#     is treated as structurally absent (its weight redistributes per
#     scoring-brief.md). Only hand-curate when you've verified the mapping
#     against the live registry — no fuzzy matching, ever.

servers:

  # ── polygraph itself (1) ─────────────────────────────────────────────
  # Our own MCP server. Dogfooding: it exposes check_server / list_servers
  # MCP tools that wrap /api/cli/check and /api/cli/list, so agents can
