<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in to polygraph.so</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f1e8;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f1e8;">
    <tr>
      <td align="center" style="padding:48px 24px 64px;">

        <table width="520" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;width:100%;">

          <!-- Logo -->
          <tr>
            <td style="padding-bottom:28px;border-bottom:1px solid #ddd8ce;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:9px;vertical-align:middle;">
                    <div style="width:7px;height:7px;background-color:#7b1c1c;"></div>
                  </td>
                  <td style="vertical-align:middle;">
                    <span style="font-family:'Courier New',Courier,monospace;font-size:11px;font-weight:400;letter-spacing:0.18em;text-transform:uppercase;color:#2a2218;text-decoration:none;">polygraph.so</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding-top:36px;padding-bottom:36px;">

              <p style="margin:0 0 6px 0;font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#9a917f;">Sign in</p>

              <h1 style="margin:0 0 18px 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:26px;font-weight:400;line-height:1.25;color:#1e1a12;">Your sign-in link.</h1>

              <p style="margin:0 0 32px 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:15px;line-height:1.65;color:#4a4234;">
                Click below to sign in to polygraph.so. This link expires in one hour and can only be used once.
              </p>

              <!-- CTA button — table wrapper for email-client compatibility -->
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#1e1a12;border-radius:2px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;padding:12px 22px;font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#f5f1e8;text-decoration:none;white-space:nowrap;">
                      Sign in to polygraph.so &rarr;
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top:24px;border-top:1px solid #ddd8ce;">
              <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:11px;line-height:1.6;color:#9a917f;">
                If you didn&rsquo;t request this, ignore it &mdash; no account has been created.<br>
                polygraph.so
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
