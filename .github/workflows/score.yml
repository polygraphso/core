# .github/workflows/score.yml
name: adoption-score

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

concurrency:
  group: adoption-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — it conflicts with package.json's `packageManager`
      # field (pnpm/action-setup@v4 errors on "multiple versions specified").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: @supabase/supabase-js needs a global WebSocket (realtime client
          # throws on Node 20 — "install ws for Node < 22").
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Seed (idempotent — picks up servers.yaml changes)
        run: pnpm --filter @polygraph/scoring seed:ci
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.SCORING_GITHUB_TOKEN }}
      - name: Score
        run: pnpm --filter @polygraph/scoring score:ci
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.SCORING_GITHUB_TOKEN }}
