name: Fulfill grade requests

# Hourly drain of the public grade-request queue: reconcile requests whose
# grading run finished (complete + email the requester on publish; decline on
# failure), then enqueue the oldest queued requests onto the hosted runner's
# free auto-publish lane (capped per pass — the box grades serially).
# Offset from alerts.yml (:23) so the two jobs don't contend.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fulfill-grade-requests
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fulfill grade requests
        run: pnpm --filter @polygraph/scoring fulfill:ci
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
          POLYGRAPH_SITE_URL: ${{ vars.POLYGRAPH_SITE_URL }}
