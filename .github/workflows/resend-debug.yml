# Temporary debug workflow — DELETE after use.
name: resend-debug
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: List verified Resend domains for this API key
        run: |
          curl -s https://api.resend.com/domains \
            -H "Authorization: Bearer $RESEND_API_KEY" | jq .
      - name: Try sending a test email
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "polygraph <alerts@polygraph.so>",
              "to": ["ruben.sousa.dinis@gmail.com"],
              "subject": "polygraph resend debug",
              "text": "test"
            }' | jq .
