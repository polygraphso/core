name: Deprecate @polygraphso/mcp

# ONE-SHOT, manual-only: marks every version of @polygraphso/mcp deprecated on
# npm, pointing installs at @polygraphso/litmus (where the lookup tools now
# ship). Run it once from the Actions tab (or `gh workflow run deprecate-mcp.yml`),
# verify with `npm view @polygraphso/mcp deprecated`, then DELETE this file —
# it has no reason to outlive its single run.

on:
  workflow_dispatch: {}

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Deprecate all versions
        run: >
          npm deprecate @polygraphso/mcp
          "Moved into @polygraphso/litmus — the polygraph MCP server (check_server, list_servers, request_grade, run_litmus, verify_attestation) ships there. Install: npx -y -p @polygraphso/litmus polygraphso-litmus-mcp"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
